# Zybo Z7-20 PetaLinux demo - kernel config fragment for linux-xlnx 6.12 (2025.2)
# Base: xilinx_zynq_defconfig. Replaces devtool-fragment.cfg / user_2021-09-16-08-08-00.cfg

# ---- Kernel log / CMA ----
CONFIG_LOG_BUF_SHIFT=21
CONFIG_LOG_CPU_MAX_BUF_SHIFT=21
CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_CMA_SIZE_MBYTES=128

# ---- UIO (generic-uio: LED/SW/BTN GPIO, PWM RGB, VTC in, VDMA0, video GPIO) ----
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y

# ---- USB host (ULPI PHY) ----
CONFIG_USB_PHY=y
CONFIG_USB_ULPI=y

# ---- I2C (AXI IIC for Pcam) ----
CONFIG_I2C_XILINX=y

# ---- Pcam 5C: OV5640 -> MIPI CSI-2 RX SS -> Frame Buffer Write ----
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_SUPPORT_FILTER=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_XILINX=y
CONFIG_VIDEO_XILINX_CSI2RXSS=y
CONFIG_XILINX_FRMBUF=y
CONFIG_VIDEO_CAMERA_SENSOR=y
CONFIG_VIDEO_OV5640=y

# ---- USB webcams (UVC) ----
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB_VIDEO_CLASS=y
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y
# CONFIG_USB_GSPCA is not set

# ---- Audio: ADI AXI I2S + SSM2603 via simple-audio-card ----
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_SOC_ADI=y
CONFIG_SND_SOC_ADI_AXI_I2S=y
CONFIG_SND_SOC_SSM2602_I2C=y
CONFIG_SND_SIMPLE_CARD=y

# ---- HDMI out: VDMA1 -> pl-disp -> VTC -> rgb2dvi (axi_dynclk) ----
CONFIG_XILINX_DMA=y
CONFIG_COMMON_CLK_DGLNT_DYNCLK=y
CONFIG_DRM=y
CONFIG_DRM_XLNX=y
CONFIG_DRM_XLNX_BRIDGE=y
CONFIG_DRM_XLNX_BRIDGE_VTC=y
CONFIG_DRM_XLNX_PL_DISP=y
CONFIG_DRM_DIGILENT_HDMI=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_FBDEV_OVERALLOC=100

# ---- Framebuffer console on HDMI ----
CONFIG_FB=y
CONFIG_VT_HW_CONSOLE_BINDING=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_FONT_SUPPORT=y
CONFIG_FONTS=y
CONFIG_FONT_8x8=y
CONFIG_FONT_8x16=y
